[package]
name = "olive-browser"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight Rust browser with HTML, CSS and JavaScript"
license = "Apache-2.0"
repository = "https://github.com/mtzahor/olive-browser"
readme = "README.md"
default-run = "olive"

[lib]
name = "olive_html"

[[bin]]
name = "olive"
path = "src/main.rs"

[[bin]]
name = "olive-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[[bin]]
name = "olive-js"
path = "src/js/main.rs"
required-features = ["js"]

[[example]]
name = "resource-report"
path = "examples/resource-report.rs"
required-features = ["net", "css", "js"]

[features]
default = []
css = ["dep:cssparser"]
js = ["dep:boa_engine", "dep:boa_gc", "dep:boa_parser"]
net = ["dep:reqwest", "dep:url", "dep:encoding_rs", "dep:percent-encoding"]
gui = ["css", "js", "net", "dep:eframe", "dep:image", "dep:rfd", "dep:zune-jpeg", "dep:serde", "dep:serde_json", "dep:tempfile", "dep:time"]

[dependencies]
html5ever = "0.39.0"
cssparser = { version = "0.37.0", optional = true }
# Boa exposes its total VM instruction counter through the `fuzz` feature.
boa_engine = { version = "0.22.0", optional = true, default-features = false, features = ["annex-b", "fuzz"] }
boa_gc = { version = "0.22.0", optional = true }
boa_parser = { version = "0.22.0", optional = true }
eframe = { version = "0.36.1", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.9", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.17.2", optional = true }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots", "gzip", "deflate"] }
url = { version = "2.5.8", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
zune-jpeg = { version = "0.4.21", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
tempfile = { version = "3.27.0", optional = true }
time = { version = "0.3.55", optional = true }

[dev-dependencies]
flate2 = "1.1.10"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

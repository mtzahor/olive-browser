[package]
name = "olive-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
olive-browser = { path = "..", features = ["gui"] }

# Its own workspace, so the browser's builds and tests never include it.
[workspace]
members = ["."]

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cookies"
path = "fuzz_targets/cookies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "location"
path = "fuzz_targets/location.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tab_message"
path = "fuzz_targets/tab_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network_message"
path = "fuzz_targets/network_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image"
path = "fuzz_targets/image.rs"
test = false
doc = false
bench = false

# Dependency policy, checked by `cargo deny check` in the `deny` CI job.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it is listed here with why it
# cannot reach Olive and what would remove it.
ignore = [
    # quick-xml 0.38 comes only through zbus_xml in eframe's Linux
    # accessibility bridge (accesskit_unix → atspi). It parses the D-Bus
    # interface files bundled with atspi, in a compile-time macro and atspi's
    # tests, never web content. The fix needs atspi on zbus_xml 6.
    { id = "RUSTSEC-2026-0194", reason = "parses only atspi's bundled D-Bus XML at compile time" },
    { id = "RUSTSEC-2026-0195", reason = "parses only atspi's bundled D-Bus XML at compile time" },
    # zbus carries the Linux accessibility bridge's D-Bus messages; eframe
    # 0.37 has no maintained successor for these zbus parts.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained zvariant, used by eframe's Linux accessibility bridge" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained zbus_names, used by eframe's Linux accessibility bridge" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained zvariant_derive, used by eframe's Linux accessibility bridge" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.9
# Permissive licenses, plus the font licenses of egui's bundled fonts and the
# CDLA data license of the bundled root certificates.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Servo's CSS parser and its helpers are MPL-2.0, whose copyleft covers
# changes to their own files; Olive uses them unmodified.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
]
